[package]
name = "desktop_floating_widget"
version = "2.0.0"
edition = "2021"

[dependencies]
slint = "1.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ssh2 = "0.9"
dirs = "5.0"
tray-icon = "0.19"
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Foundation"] }

[build-dependencies]
slint-build = "1.8"
